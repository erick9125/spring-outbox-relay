name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Java 24 is the ceiling for Gradle 8.14.3; running it on JDK 25 fails outright, and
        # Java 25 needs Gradle 9.1+. Adding a version here also does not widen coverage on its
        # own: the toolchain in build.gradle.kts is pinned to 21, so every entry compiles and
        # tests against 21 regardless. To test another Java version for real, keep Gradle on 21
        # and parameterise the toolchain instead.
        java-version: [21]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit, integration, format, and static checks
        run: ./gradlew check

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4

      - name: Build library jar
        run: ./gradlew build -x test
